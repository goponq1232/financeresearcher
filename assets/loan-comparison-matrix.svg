<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Loan comparison matrix</title>
  <desc id="desc">A simple visual showing APR, fees, term, payment, and total repayment as the five key loan comparison factors.</desc>
  <rect width="1200" height="500" rx="30" fill="#f4f8f6"/>
  <text x="70" y="76" fill="#173b4c" font-family="Arial, sans-serif" font-size="36" font-weight="700">Five numbers to compare before you borrow</text>
  <g transform="translate(70 130)">
    <g>
      <rect width="190" height="260" rx="24" fill="#ffffff" stroke="#d7e4df"/>
      <circle cx="48" cy="50" r="25" fill="#e6f3ee"/>
      <text x="48" y="58" text-anchor="middle" fill="#0f6f54" font-family="Arial" font-size="20" font-weight="700">1</text>
      <text x="28" y="112" fill="#173b4c" font-family="Arial" font-size="24" font-weight="700">APR</text>
      <text x="28" y="150" fill="#6e7f78" font-family="Arial" font-size="17">Broad borrowing</text>
      <text x="28" y="176" fill="#6e7f78" font-family="Arial" font-size="17">cost indicator</text>
    </g>
    <g transform="translate(215)">
      <rect width="190" height="260" rx="24" fill="#ffffff" stroke="#d7e4df"/>
      <circle cx="48" cy="50" r="25" fill="#e6f3ee"/>
      <text x="48" y="58" text-anchor="middle" fill="#0f6f54" font-family="Arial" font-size="20" font-weight="700">2</text>
      <text x="28" y="112" fill="#173b4c" font-family="Arial" font-size="24" font-weight="700">Fees</text>
      <text x="28" y="150" fill="#6e7f78" font-family="Arial" font-size="17">Check origination</text>
      <text x="28" y="176" fill="#6e7f78" font-family="Arial" font-size="17">and other costs</text>
    </g>
    <g transform="translate(430)">
      <rect width="190" height="260" rx="24" fill="#ffffff" stroke="#d7e4df"/>
      <circle cx="48" cy="50" r="25" fill="#e6f3ee"/>
      <text x="48" y="58" text-anchor="middle" fill="#0f6f54" font-family="Arial" font-size="20" font-weight="700">3</text>
      <text x="28" y="112" fill="#173b4c" font-family="Arial" font-size="24" font-weight="700">Term</text>
      <text x="28" y="150" fill="#6e7f78" font-family="Arial" font-size="17">Longer can mean</text>
      <text x="28" y="176" fill="#6e7f78" font-family="Arial" font-size="17">more total interest</text>
    </g>
    <g transform="translate(645)">
      <rect width="190" height="260" rx="24" fill="#ffffff" stroke="#d7e4df"/>
      <circle cx="48" cy="50" r="25" fill="#e6f3ee"/>
      <text x="48" y="58" text-anchor="middle" fill="#0f6f54" font-family="Arial" font-size="20" font-weight="700">4</text>
      <text x="28" y="112" fill="#173b4c" font-family="Arial" font-size="24" font-weight="700">Payment</text>
      <text x="28" y="150" fill="#6e7f78" font-family="Arial" font-size="17">Test against your</text>
      <text x="28" y="176" fill="#6e7f78" font-family="Arial" font-size="17">real monthly budget</text>
    </g>
    <g transform="translate(860)">
      <rect width="190" height="260" rx="24" fill="#0f6f54"/>
      <circle cx="48" cy="50" r="25" fill="#d9f35b"/>
      <text x="48" y="58" text-anchor="middle" fill="#173b4c" font-family="Arial" font-size="20" font-weight="700">5</text>
      <text x="28" y="112" fill="#ffffff" font-family="Arial" font-size="24" font-weight="700">Total</text>
      <text x="28" y="150" fill="#cfe7de" font-family="Arial" font-size="17">The number that</text>
      <text x="28" y="176" fill="#cfe7de" font-family="Arial" font-size="17">ties it all together</text>
    </g>
  </g>
</svg>