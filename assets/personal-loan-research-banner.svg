<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Finance Researcher</title>
  <desc id="desc">A clean finance research banner about comparing personal loan offers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2f3a"/>
      <stop offset="0.6" stop-color="#0f5f4b"/>
      <stop offset="1" stop-color="#1f8a68"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset="1" stop-color="#ecf7f2" stop-opacity=".98"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#061c22" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="210" fill="#d9f35b" opacity=".18"/>
  <circle cx="95" cy="655" r="230" fill="#ffffff" opacity=".05"/>
  <g transform="translate(110 115)">
    <text x="0" y="0" fill="#d9f35b" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">FINANCE RESEARCHER</text>
    <text x="0" y="92" fill="#ffffff" font-family="Arial, sans-serif" font-size="66" font-weight="700">Compare personal loans</text>
    <text x="0" y="166" fill="#ffffff" font-family="Arial, sans-serif" font-size="66" font-weight="700">beyond the headline rate.</text>
    <text x="0" y="230" fill="#cbe3da" font-family="Arial, sans-serif" font-size="29">APR · fees · term · monthly payment · total repayment</text>
    <g transform="translate(0 292)">
      <rect width="480" height="150" rx="24" fill="url(#card)" filter="url(#shadow)"/>
      <text x="34" y="52" fill="#50625b" font-family="Arial, sans-serif" font-size="20">A better loan comparison asks:</text>
      <text x="34" y="95" fill="#173b4c" font-family="Arial, sans-serif" font-size="31" font-weight="700">“What will I pay in total?”</text>
      <text x="34" y="129" fill="#0f6f54" font-family="Arial, sans-serif" font-size="19">Not only: “What is my monthly payment?”</text>
    </g>
  </g>
  <g transform="translate(1040 150)" filter="url(#shadow)">
    <rect width="380" height="420" rx="30" fill="#ffffff"/>
    <text x="36" y="58" fill="#173b4c" font-family="Arial, sans-serif" font-size="25" font-weight="700">Loan comparison</text>
    <g transform="translate(36 105)">
      <text x="0" y="0" fill="#6e7f78" font-family="Arial, sans-serif" font-size="18">APR</text>
      <text x="255" y="0" fill="#173b4c" font-family="Arial, sans-serif" font-size="22" font-weight="700">10.8%</text>
      <rect y="22" width="308" height="1" fill="#dce7e2"/>
      <text x="0" y="65" fill="#6e7f78" font-family="Arial, sans-serif" font-size="18">Fee</text>
      <text x="255" y="65" fill="#173b4c" font-family="Arial, sans-serif" font-size="22" font-weight="700">$250</text>
      <rect y="87" width="308" height="1" fill="#dce7e2"/>
      <text x="0" y="130" fill="#6e7f78" font-family="Arial, sans-serif" font-size="18">Term</text>
      <text x="220" y="130" fill="#173b4c" font-family="Arial, sans-serif" font-size="22" font-weight="700">36 months</text>
      <rect y="152" width="308" height="1" fill="#dce7e2"/>
      <text x="0" y="195" fill="#6e7f78" font-family="Arial, sans-serif" font-size="18">Payment</text>
      <text x="239" y="195" fill="#173b4c" font-family="Arial, sans-serif" font-size="22" font-weight="700">$326</text>
      <rect y="217" width="308" height="1" fill="#dce7e2"/>
      <text x="0" y="260" fill="#6e7f78" font-family="Arial, sans-serif" font-size="18">Total</text>
      <text x="210" y="260" fill="#0f6f54" font-family="Arial, sans-serif" font-size="22" font-weight="700">$11,736</text>
    </g>
    <rect x="36" y="352" width="308" height="42" rx="13" fill="#e9f4ef"/>
    <text x="190" y="379" text-anchor="middle" fill="#0f6f54" font-family="Arial, sans-serif" font-size="17" font-weight="700">COMPARE THE WHOLE OFFER</text>
  </g>
</svg>